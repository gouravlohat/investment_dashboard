name: investment_dashboard
description: "Mindorigin Portfolio — live investment dashboard with WebSocket data."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5

  # Networking / realtime
  web_socket_channel: ^3.0.1
  connectivity_plus: ^6.1.0

  # DI
  get_it: ^8.0.2

  # Charts
  fl_chart: ^0.69.2

  # Formatting / persistence
  intl: ^0.20.1
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
